<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' blob: mediastream:; script-src 'self' 'unsafe-inline'">
<title>右上角控制台</title>
<link rel="stylesheet" href="glass.css">
</head>
<body>

<!-- ==================== 窄条窗口 ==================== -->
<div id="strip" class="strip" hidden>
  <div class="strip-cap" id="strip-cap">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
</div>

<!-- ==================== 面板窗口 ==================== -->
<div id="panel" class="panel" hidden>
  <!-- 整块玻璃：背景图 + 染色 + 内容 + 边框，全部装在这一个元素里，
       展开时只有这一个元素做 transform，所以内外绝对同步。 -->
  <div class="glass" id="glass">
    <video class="live" id="live" playsinline muted autoplay></video>
    <img class="backdrop" id="backdrop" alt="">
    <div class="tint"></div>
    <div class="sheen"></div>

    <div class="content">
      <header class="hdr">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"></circle>
          </svg>
        </div>
        <div class="titles">
          <div class="t1" id="t1">控制台</div>
          <div class="t2" id="t2">阶段 1.9 · 整块玻璃</div>
        </div>
      </header>

      <div class="stage">
        <!-- 层 1：四宫格 -->
        <section class="view l1 is-on" id="view-l1">
          <button class="cell" data-module="launch">
            <span class="ico">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
            </span>
            <span class="ct">快捷启动</span>
            <span class="cs">添加 / 排序 / 启动软件</span>
          </button>
          <button class="cell" data-module="music">
            <span class="ico">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle>
              </svg>
            </span>
            <span class="ct">音乐</span>
            <span class="cs">控制当前播放器</span>
          </button>
          <button class="cell" data-module="wallpaper">
            <span class="ico">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                <path d="M3 9h18M9 9v11"></path>
              </svg>
            </span>
            <span class="ct">壁纸</span>
            <span class="cs">Wallpaper Engine</span>
          </button>
          <button class="cell" data-module="notify">
            <span class="ico">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M12 3a5 5 0 0 0-5 5v3.5L5.5 16h13L17 11.5V8a5 5 0 0 0-5-5z"></path>
                <path d="M10 19a2 2 0 0 0 4 0"></path>
              </svg>
            </span>
            <span class="ct">通知</span>
            <span class="cs">QQ / 邮件 / Edge</span>
            <span class="cell-badge" id="n-badge" hidden>0</span>
          </button>
        </section>

        <!-- 层 2：单模块 -->
        <section class="view l2" id="view-l2">
          <div class="mod launch" id="mod-body">
            <div class="l-bar">
              <span class="l-hint" id="l-hint">点图标启动 · 拖动排序 · 右键删除</span>
              <button class="l-browse" id="l-browse" title="手动选择任意位置的程序或快捷方式">手动添加</button>
              <button class="l-add" id="l-add" title="添加软件">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                  <path d="M12 5v14M5 12h14"></path>
                </svg>
              </button>
            </div>
            <div class="l-grid" id="l-grid"></div>
            <div class="l-empty" id="l-empty">
              <div class="l-empty-t">这里还是空的</div>
              <div class="l-empty-s">点「手动添加」挑一个 exe 或快捷方式（桌面、开始菜单、任何文件夹都行）</div>
            </div>
          </div>

          <!-- 音乐：系统媒体控制（SMTC） -->
          <div class="mod music" id="mod-music" hidden>
            <div class="m-head">
              <div class="m-art" id="m-art">
                <img id="m-art-img" alt="" hidden>
                <svg id="m-art-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                  <path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle>
                </svg>
              </div>
              <div class="m-meta">
                <div class="m-title" id="m-title">未在播放</div>
                <div class="m-artist" id="m-artist">打开 QQ 音乐放一首歌</div>
              </div>
            </div>

            <div class="m-line">
              <span class="m-t" id="m-cur">0:00</span>
              <div class="m-bar"><div class="m-fill" id="m-fill"></div></div>
              <span class="m-t" id="m-dur">0:00</span>
            </div>

            <div class="m-btns">
              <button class="m-btn" id="m-prev" title="上一首">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M7 5h2v14H7zM19 5v14L9.5 12z"></path></svg>
              </button>
              <button class="m-btn main" id="m-play" title="播放 / 暂停">
                <svg id="m-play-ico" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
              </button>
              <button class="m-btn" id="m-next" title="下一首">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M15 5h2v14h-2zM5 5v14l9.5-7z"></path></svg>
              </button>
            </div>

            <div class="m-vol">
              <svg class="m-vol-ico" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                <path d="M4 9.5h3.2L12 6v12l-4.8-3.5H4z" fill="currentColor"></path>
                <path d="M15.4 9.2a4 4 0 0 1 0 5.6M17.9 6.9a7.4 7.4 0 0 1 0 10.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
              </svg>
              <input class="m-vol-range" id="m-vol" type="range" min="0" max="100" step="1" value="0" title="播放器自己的音量（不改系统总音量）">
              <span class="m-vol-t" id="m-vol-t">—</span>
            </div>
          </div>

          <!-- 壁纸：Wallpaper Engine 官方命令行 -->
          <div class="mod wall" id="mod-wall" hidden>
            <div class="w-bar">
              <span class="w-cur" id="w-cur">正在读取壁纸…</span>
              <span class="w-acts">
                <button class="w-btn" id="w-stop" title="停止播放壁纸">停止</button>
                <button class="w-btn" id="w-play" title="继续播放壁纸">恢复</button>
                <button class="w-btn" id="w-open" title="打开 Wallpaper Engine 主界面">WE</button>
              </span>
            </div>
            <div class="w-grid" id="w-grid"></div>
          </div>

          <!-- 通知：只读 Windows 通知中心（微信不走系统通知，已永久暂停） -->
          <div class="mod notify" id="mod-notify" hidden>
            <div class="n-bar">
              <span class="n-hint" id="n-hint">点一条可删 · 只在内存里，关掉就清空</span>
              <button class="n-clear" id="n-clear" title="一键清空（全部已读）">清空</button>
            </div>
            <div class="n-list" id="n-list"></div>
            <div class="n-empty" id="n-empty">
              <div class="n-empty-t">还没有新通知</div>
              <div class="n-empty-s">QQ、邮件、Edge 的新消息会显示发送人 + 正文前 15 字</div>
            </div>
          </div>
        </section>
      </div>

      <!-- 设置浮层（绝对定位，不占文档流） -->
      <div class="settings" id="settings" hidden>
        <label class="row">
          <span class="rname">背景不透明度</span>
          <span class="rval" id="v-opacity">30%</span>
        </label>
        <input id="r-opacity" class="range" type="range" min="10" max="100" value="30">
        <label class="row">
          <span class="rname">背景模糊</span>
          <span class="rval" id="v-blur">18px</span>
        </label>
        <input id="r-blur" class="range" type="range" min="0" max="40" value="18">
        <div class="hint">往左更通透（能看清后面的桌面），往右更实。</div>
      </div>

      <footer class="ftr">
        <span id="pos">x=0 y=0</span>
        <span id="hint-esc">Esc / 点外部 收起</span>
      </footer>
    </div>

    <!-- 按钮绝对定位，悬浮不挤压布局 -->
    <button class="icon-btn gear" id="btn-gear" title="外观设置">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-2.9-1.2l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 3 15a2 2 0 0 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 10 4.5V4a2 2 0 1 1 4 0v.5a1.7 1.7 0 0 0 2.9 1.2l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 21 11a2 2 0 0 1 0 4z"></path>
      </svg>
    </button>
    <button class="icon-btn back" id="btn-back" title="返回" hidden>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M14.5 5.5 8 12l6.5 6.5"></path>
      </svg>
    </button>
    <button class="icon-btn close" id="btn-close" title="收起">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M6 9.5 12 15l6-5.5"></path>
      </svg>
    </button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
